<style>
  :root{

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--pale); color:var(--ink);
    font-family:Archivo,'Helvetica Neue',Arial,sans-serif;
    font-size:16px; line-height:1.5;
    padding:28px 18px 64px;
  }
  .wrap{max-width:840px;margin:0 auto}
  header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:26px}
  h1{font-size:1.55rem;font-weight:700;letter-spacing:-.015em;margin:0 0 4px}
  header p{margin:0;color:var(--steel);font-size:.9rem}
  .panel{background:var(--panel);border:1px solid var(--line);padding:22px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .f-full{grid-column:1 / -1}
  label{display:block;font-size:.83rem;font-weight:600;margin-bottom:6px}
  select,input{
    width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:#fbfcfd;
    border:1px solid var(--line);border-radius:0;padding:11px 12px;
  }
  select:focus,input:focus{outline:2px solid var(--ink);outline-offset:1px;background:#fff}
  .hint{font-size:.78rem;color:var(--steel);margin-top:6px}

  .result{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--hi)}
  .result.consult{border-left-color:var(--warn)}
  .amount{padding:22px 22px 18px;border-bottom:1px solid var(--line-soft)}
  .amount .lab{font-size:.83rem;color:var(--steel);margin-bottom:2px}
  .value{font-size:2.9rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
  .value small{font-size:1rem;font-weight:500;color:var(--steel);letter-spacing:0}
  .sub{font-size:.9rem;color:var(--steel);margin-top:6px}

  .method{padding:20px 22px}
  .method h2{font-size:.95rem;font-weight:700;margin:0 0 12px}
  ol{margin:0;padding-left:1.15rem}
  ol li{margin-bottom:9px;font-size:.92rem}
  ol li:last-child{margin-bottom:0}
  b{font-weight:600}
  .calc{font-variant-numeric:tabular-nums;background:#f2f4f6;padding:1px 5px}

  table{width:100%;border-collapse:collapse;margin-top:20px;font-size:.83rem}
  caption{text-align:left;font-size:.83rem;color:var(--steel);padding-bottom:7px}
  th,td{border-bottom:1px solid var(--line-soft);padding:7px 8px;text-align:right;font-variant-numeric:tabular-nums}
  th{font-weight:600;text-align:right;color:var(--steel);border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  tr.on td{background:var(--hi);font-weight:700}
  footer{margin-top:26px;font-size:.78rem;color:var(--steel)}
  footer p{margin:0 0 5px}
  @media (max-width:620px){ .fields{grid-template-columns:1fr} .value{font-size:2.2rem} table{font-size:.76rem} th,td{padding:6px 5px} }
</style>
</head>

const artSel = document.getElementById('art');
const depSel = document.getElementById('dep');
const mtIn   = document.getElementById('mt');
const res    = document.getElementById('res');
const hintArt= document.getElementById('hint-art');

const gLabels = {G1:'Grille 1',G2:'Grille 2',G3:'Grille 3',G4:'Grille 4'};
const groups = {};
DB.articles.forEach((a,i)=>{ (groups[a.g] = groups[a.g]||[]).push({...a,i}); });
Object.keys(groups).forEach(k=>{
  const og = document.createElement('optgroup');
  og.label = gLabels[k];
  groups[k].forEach(a=>{
    const o = document.createElement('option');
    o.value = a.i; o.textContent = a.nom + (a.sup ? ' (+ ' + a.sup + ' €)' : '');
    og.appendChild(o);
  });
  artSel.appendChild(og);
});

const optV = document.createElement('option');
optV.value=''; optV.textContent='— Choisir —'; depSel.appendChild(optV);
Object.keys(DB.deps).map(Number).sort((a,b)=>a-b).forEach(n=>{
  const o=document.createElement('option');
  o.value=n; o.textContent = String(n).padStart(2,'0') + ' — ' + DB.deps[n];
  depSel.appendChild(o);
});
const oAut=document.createElement('option');
oAut.value='autres'; oAut.textContent='Autres départements / DOM-TOM';
depSel.appendChild(oAut);

const eur = n => n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const pct = n => (n*100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' %';

function bracketIndex(seuils, m){
  for(let i=0;i<seuils.length;i++){ if(m<=seuils[i]) return i; }
  return seuils.length; // 7 => dernière tranche
}

function render(){
  const a = DB.articles[artSel.value];
  const G = DB.grilles[a.g];
  hintArt.textContent = 'Tarifé sur la ' + gLabels[a.g] + (a.sup ? ' + supplément fixe de ' + a.sup + ' €' : '');

  const dep = depSel.value;
  const m = parseFloat(mtIn.value);

  if(dep === '' || isNaN(m)){
    res.className = 'result';
    res.innerHTML = '<div class="amount"><div class="lab">Coût de transport</div>'
      + '<div class="value">—</div><div class="sub">Renseignez le montant de la commande et le département de livraison.</div></div>';
    return;
  }

  if(dep === 'autres' || Number(dep) === 20 || G.data[dep] === 'CONSULT'){
    res.className = 'result consult';
    res.innerHTML = '<div class="amount"><div class="lab">Coût de transport</div>'
      + '<div class="value">Sur consultation</div>'
      + '<div class="sub">Cette destination n\'est pas tarifée dans la grille : demander un prix de transport à Manorga.</div></div>';
    return;
  }

  const row = G.data[dep];
  const idx = bracketIndex(G.seuils, m);
  const val = row[idx];
  const forfait = idx < 2;
  const base = forfait ? val : m * val;
  const total = base + a.sup;

  const depTxt = String(dep).padStart(2,'0') + ' — ' + DB.deps[dep];

  let steps = '';
  steps += '<li>Article <b>' + a.nom + '</b> → tarifé sur la <b>' + gLabels[a.g] + '</b>.</li>';
  steps += '<li>Département <b>' + depTxt + '</b> → ligne correspondante de la grille.</li>';
  steps += '<li>Montant <span class="calc">' + eur(m) + '</span> → tranche <b>' + G.libelles[idx] + '</b>'
        + (forfait ? ', facturée <b>au forfait</b>.' : ', facturée <b>au pourcentage</b> du montant tarif HT.') + '</li>';
  if(forfait){
    steps += '<li>Forfait de la case : <span class="calc">' + eur(val) + '</span>.</li>';
  } else {
    steps += '<li>Taux de la case : <span class="calc">' + pct(val) + '</span> → '
          + '<span class="calc">' + eur(m) + ' × ' + pct(val) + ' = ' + eur(base) + '</span></li>';
  }
  if(a.sup) steps += '<li>Supplément fixe <b>' + a.nom + '</b> : <span class="calc">+ ' + eur(a.sup) + '</span>.</li>';
  steps += '<li>Frais de port : <b>' + eur(total) + '</b> HT.</li>';

  let rows = '';
  G.libelles.forEach((lb,i)=>{
    const v = row[i];
    rows += '<tr class="' + (i===idx?'on':'') + '"><td>' + lb + '</td><td>'
         + (i<2 ? eur(v) + ' (forfait)' : pct(v)) + '</td></tr>';
  });

  res.className = 'result';
  res.innerHTML =
    '<div class="amount">'
      + '<div class="lab">Coût de transport</div>'
      + '<div class="value">' + eur(total) + ' <small>HT</small></div>'
      + '<div class="sub">' + a.nom + ' · ' + depTxt + ' · commande ' + eur(m) + ' HT</div>'
    + '</div>'
    + '<div class="method">'
      + '<h2>Méthode de calcul</h2><ol>' + steps + '</ol>'
      + '<table><caption>' + gLabels[a.g] + ' — barème du département ' + String(dep).padStart(2,'0') + '</caption>'
      + '<thead><tr><th>Tranche de commande HT</th><th>Tarif appliqué</th></tr></thead><tbody>' + rows + '</tbody></table>'
    + '</div>';
}

artSel.addEventListener('change',render);
depSel.addEventListener('change',render);
mtIn.addEventListener('input',render);
render();
</script>
